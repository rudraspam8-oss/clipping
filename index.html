<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ClipForge</title><meta name="theme-color" content="#121214"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@500;700;800&family=Lobster&family=Montserrat:wght@800&family=Oswald:wght@600&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@700&family=Righteous&family=Roboto+Mono:wght@700&family=Rubik+Mono+One&family=Playfair+Display:ital,wght@0,800;1,600&family=Cormorant+Garamond:ital,wght@1,600&family=DM+Serif+Display&family=Abril+Fatface&family=Archivo+Black&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Fredoka:wght@600&family=Luckiest+Guy&family=Russo+One&family=Black+Ops+One&family=Staatliches&family=Teko:wght@600&family=Cinzel:wght@800&family=Lilita+One&family=Shrikhand&family=Kalam:wght@700&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121214;--s1:#1b1b1f;--s2:#26262c;--bd:#33333b;--tx:#f5f2ec;--mu:#8f8d98;--ac:#ff4b3e;--ac2:#ffd23f}
[data-t=light]{--bg:#f6f3ec;--s1:#fff;--s2:#ebe7dd;--bd:#d9d4c6;--tx:#17171a;--mu:#6f6c63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.45 Inter,system-ui,sans-serif}
#app{max-width:480px;margin:auto;min-height:100vh;padding-top:env(safe-area-inset-top)}
.in{padding:18px 18px calc(96px + env(safe-area-inset-bottom))}
h1{font:800 30px/1.05 'Bricolage Grotesque',Inter,sans-serif;margin:6px 0 6px;letter-spacing:-.02em}
h2{font:800 18px 'Bricolage Grotesque',Inter;margin:20px 0 8px}
.mu,small{color:var(--mu)}p{margin:0 0 14px}
.tape{height:10px;margin:0 -18px 14px;background:repeating-linear-gradient(90deg,var(--bd) 0 2px,transparent 2px 12px);-webkit-mask:linear-gradient(#000 0 100%)}
.brand{display:flex;align-items:center;gap:10px;font:800 20px 'Bricolage Grotesque';margin-bottom:4px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);display:grid;place-items:center;color:#fff;font-size:18px;transform:rotate(-6deg)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:0 0 14px}
.c{text-align:center;padding:30px 18px}
.btn{appearance:none;border:0;background:var(--ac);color:#fff;font:800 15px Inter;padding:13px 18px;border-radius:12px;flex:1;cursor:pointer;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}.btn.ghost{background:var(--s2);color:var(--tx)}
.row{display:flex;gap:10px;margin:10px 0}
input[type=text],input[type=password],textarea{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:13px;font:500 15px Inter;margin:6px 0;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:64px;resize:vertical}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:4px;margin:16px 0}
.seg button{flex:1;border:0;background:0;color:var(--mu);font:700 14px Inter;padding:10px;border-radius:9px}
.seg .on{background:var(--s1);color:var(--tx)}
.err{color:var(--ac);min-height:20px;font-size:13px}
.drop{display:block;border:2px dashed var(--bd);border-radius:22px;padding:42px 20px;text-align:center;margin:18px 0;cursor:pointer;background:var(--s1)}
.drop:active{border-color:var(--ac)}.drop .ic{font-size:42px}.drop b{display:block;font-size:17px;margin:8px 0 2px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--s1);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:0;color:var(--mu);font:700 11px Inter;display:grid;gap:2px;justify-items:center;padding:6px}
nav button i{font-style:normal;font-size:20px}nav .on{color:var(--ac)}
.bar{height:8px;background:var(--s2);border-radius:9px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.spin{width:34px;height:34px;border:4px solid var(--s2);border-top-color:var(--ac);border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.clip video{width:100%;aspect-ratio:9/12;object-fit:cover;background:#000;border-radius:12px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.pill{background:var(--ac2);color:#222;font:800 12px Inter;padding:3px 9px;border-radius:20px}
.sl{display:block;font-size:13px;color:var(--mu);margin:8px 0}.sl input{width:100%;accent-color:var(--ac)}
.pv{height:150px;border-radius:18px;background:linear-gradient(135deg,#3a3a46,#14141a);display:grid;place-items:center;text-align:center;margin:10px 0}.pv em{font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chips button{flex:none;border:1px solid var(--bd);background:var(--s1);color:var(--tx);border-radius:12px;padding:9px 14px;font-size:18px}.chips .on{border-color:var(--ac);background:var(--s2)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cols label{font-size:12px;color:var(--mu);display:grid;gap:4px}.cols input{width:100%;height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--s2);padding:3px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.proj{display:flex;justify-content:space-between;align-items:center;gap:10px}.proj b{display:block}
.av{width:72px;height:72px;border-radius:24px;background:var(--ac);color:#fff;font:800 32px 'Bricolage Grotesque';display:grid;place-items:center;margin:8px 0;transform:rotate(-4deg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{font:800 28px 'Bricolage Grotesque';display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:9;padding:24px}.ov .card{width:100%;max-width:340px;text-align:center}.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:90%;animation:t .25s}@keyframes t{from{opacity:0;transform:translate(-50%,10px)}}
.auth{padding:56px 22px 30px}
.pw{position:relative}.pw input{padding-right:70px}.eye{position:absolute;right:6px;top:12px;border:0;background:0;color:var(--mu);font:700 13px Inter;padding:10px}
.fab{flex:none!important;width:58px;height:58px;border-radius:20px;border:0;background:var(--ac)!important;color:#fff!important;font:800 32px Inter!important;margin-top:-26px;box-shadow:0 8px 22px rgba(255,75,62,.45);display:grid;place-items:center}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps span{flex:1;font:700 12px Inter;color:var(--mu);border-top:3px solid var(--bd);padding-top:6px}.steps .on{color:var(--tx);border-color:var(--ac)}
.opt{background:var(--s1);border:2px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0;cursor:pointer}.opt b{display:block;font-size:16px}.opt.on,.sel{border-color:var(--ac)}
.chips{flex-wrap:wrap;overflow:visible}.chips button{font-size:16px;padding:7px 11px}
</style></head><body><div id="app"></div>
<div id="ov" class="ov hide"><div class="card"><div class="spin" id="osp"></div><p id="ot"></p><div class="bar"><i id="ob" style="width:0"></i></div><button class="btn hide" id="obt"></button></div></div>
<script>
const $=s=>document.querySelector(s),L=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const sb=a=>btoa(String.fromCharCode(...new Uint8Array(a))),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'),fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const FONTS=['Anton','Bangers','Bebas Neue','Inter','Lobster','Montserrat','Oswald','Pacifico','Permanent Marker','Poppins','Righteous','Roboto Mono','Rubik Mono One','Playfair Display','DM Serif Display','Abril Fatface','Archivo Black','Caveat','Dancing Script','Fredoka','Luckiest Guy','Russo One','Black Ops One','Staatliches','Teko','Cinzel','Lilita One','Shrikhand','Kalam','Chakra Petch'],FONTS2=['Playfair Display','Cormorant Garamond','DM Serif Display','Pacifico','Caveat','Dancing Script','Lobster','Inter'];
const DEF={font:'Anton',color:'#ffffff',hi:'#ffd23f',stroke:'#000000',size:64,pos:72,upper:true,font2:'Playfair Display',mix:true,words:3,fit:false};
let me=L('me'),D=me&&L('d:'+me),clips=[],W=[],src=null,dur=0,fname='',stage='idle',msg='',pct=0,tab='projects',mode='login',err='';
if(!D)me=null;else D.style={...DEF,...D.style};
let LIB=[],mE=null,P={},ML=[],ASR,wz;const newWz=()=>({st:0,niche:null,caps:'voice',music:null,mv:.6,vv:1,mode:'auto',cust:[''],fill:true,f:null,dur:0});wz=newWz();
const mdb=async(m,...a)=>{const db=await new Promise((r,j)=>{const q=indexedDB.open('cf',1);q.onupgradeneeded=()=>q.result.createObjectStore('m',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});return new Promise((r,j)=>{const q=db.transaction('m',m=='getAll'?'readonly':'readwrite').objectStore('m')[m](...a);q.onsuccess=()=>r(q.result);q.onerror=j})};
async function loadLib(){try{LIB=(await mdb('getAll')).filter(m=>m.user==me);R()}catch(e){}}
const sv=()=>L('d:'+me,D),toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3400)};
async function hp(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return sb(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},k,256))}
async function doAuth(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,U=L('users')||{};err='';
 if(!/^[a-z0-9_.]{3,20}$/.test(u))err='Username: 3-20 letters, numbers, _ or .';
 else if(p.length<6)err='Password needs at least 6 characters';
 else if(mode=='signup'){if(U[u])err='That username is taken';else{const salt=sb(crypto.getRandomValues(new Uint8Array(16)));U[u]={salt,h:await hp(p,salt)};L('users',U);D={style:{...DEF},projects:[],saved:0,joined:Date.now()};me=u;sv()}}
 else{const a=U[u],f=L('f:'+u)||{n:0,t:0};if(Date.now()<f.t)err='Too many tries. Wait 30 seconds';else if(!a||await hp(p,a.salt)!==a.h){if(++f.n>=5){f.t=Date.now()+3e4;f.n=0}L('f:'+u,f);err='Wrong username or password'}else{me=u;D=L('d:'+u)||{style:{...DEF},projects:[],saved:0,joined:Date.now()}}}
 if(!err){L('me',me);D.style={...DEF,...D.style};loadLib()}R()}
const authV=()=>`<div class="auth"><div class="brand"><div class="logo">✂</div>ClipForge</div><h1>Long video in.<br>Shorts out.</h1><p class="mu">Sign in to keep your caption styles and history.</p><div class="seg"><button class="${mode=='login'?'on':''}" onclick="mode='login';err='';R()">Log in</button><button class="${mode=='signup'?'on':''}" onclick="mode='signup';err='';R()">Create account</button></div><input id="u" type="text" placeholder="Username" autocapitalize="off" autocomplete="username"><div class="pw"><input id="p" type="password" placeholder="Password" autocomplete="${mode=='login'?'current-password':'new-password'}" onkeydown="event.key=='Enter'&&doAuth()"><button class="eye" type="button" onclick="const p=$('#p');p.type=p.type=='password'?'text':'password';this.textContent=p.type=='password'?'Show':'Hide'">Show</button></div><div class="err">${err}</div><div class="row"><button class="btn" onclick="doAuth()">${mode=='login'?'Log in':'Create account'}</button></div><small>Accounts and history are stored on this device. Passwords are salted and hashed.</small></div>`;
function R(){const y=scrollY;document.documentElement.dataset.t=L('theme')||'dark';const a=$('#app');if(!me){a.innerHTML=authV();return}
 const T=(k,i,n)=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';R();scrollTo(0,0)"><i>${i}</i>${n}</button>`;
 a.innerHTML=`<main class="in"><div class="tape"></div>${{create:vC,projects:vP,music:()=>vM(0),style:vS,profile:vF}[tab]()}</main><nav>${T('projects','▤','Projects')}${T('music','♫','Music')}<button class="fab" onclick="newP()">+</button>${T('style','Aa','Style')}${T('profile','◉','Profile')}</nav>`;scrollTo(0,y)}
function newP(){clips=[];free();stage='idle';wz=newWz();mE=null;tab='create';R();scrollTo(0,0)}
const vC=()=>{if(stage=='work')return`<h1>Finding your best moments</h1><div class="card c"><div class="spin"></div><p>${msg}</p><div class="bar"><i style="width:${pct}%"></i></div><small>Keep this screen open. Everything runs on your phone.</small></div>`;
 if(clips.length)return`<h1>${clips.length} shorts ready</h1><p class="mu">From ${esc(fname)}. Trim, re-caption or delete, then save.</p><div class="row"><button class="btn" onclick="saveAll()">Save all</button><button class="btn ghost" onclick="newP()">New project</button></div>${clips.map(cc).join('')}`;
 const s=wz.st,hd=`<div class="steps">${['Video','Niche','Captions','Music','Shorts'].map((x,i)=>`<span class="${i<=s?'on':''}">${x}</span>`).join('')}</div>`,bk=n=>`<button class="btn ghost" onclick="wz.st=${n};R()">Back</button>`;
 if(s==0)return hd+`<h1>New project</h1><p class="mu">Pick a video up to 30 minutes. Nothing is uploaded.</p><label class="drop"><input type="file" accept="video/*" hidden onchange="wpick(this.files[0])"><div class="ic">🎞</div><b>Choose a video</b><small>Opens your gallery</small></label><small>First run downloads a 40 MB speech model, then it works offline.</small>`;
 if(s==1)return hd+`<h1>What kind of video is this?</h1><p class="mu">We use different rules to find the best moments for each kind.</p>${[['funny','😂 Funny','Jokes, reactions and laughs.'],['educational','🎓 Educational','Tips, how-tos and clear explanations.'],['motivational','🔥 Motivational','Powerful lines and strong delivery.']].map(([k,t,d])=>`<div class="opt ${wz.niche==k?'on':''}" onclick="wz.niche='${k}';wz.st=2;R()"><b>${t}</b><small>${d}</small></div>`).join('')}<div class="row">${bk(0)}</div>`;
 if(s==2)return hd+`<h1>Add auto captions?</h1>${[['voice','Yes, from the voice in the video','Best for talks and podcasts.'],['music','Yes, from the music I add','Shows the lyrics. Works best with clear vocals.'],['none','No captions','Clips only.']].map(([k,t,d])=>`<div class="opt ${wz.caps==k?'on':''}" onclick="wz.caps='${k}';R()"><b>${t}</b><small>${d}</small></div>`).join('')}<div class="row">${bk(1)}<button class="btn" onclick="wz.st=3;R()">Next</button></div>`;
 if(s==3)return hd+`<h1>Add music</h1><p class="mu">Download a song to your phone first, then upload it here. Choose the part you like and save it to reuse later.</p>${vM(1)}${wz.music&&!mE?`<div class="card"><label class="sl">Music volume<input type="range" min="0" max="1" step=".05" value="${wz.mv}" oninput="wz.mv=+this.value"></label><label class="sl">Voice in the video<input type="range" min="0" max="1" step=".05" value="${wz.vv}" oninput="wz.vv=+this.value"></label></div>`:''}${mE?'':`<div class="row">${bk(2)}<button class="btn" onclick="if(wz.caps=='music'&&!wz.music)return toast('Pick the music to read captions from');wz.st=4;R()">${wz.music?'Next':wz.caps=='music'?'Pick music':'Skip music'}</button></div>`}`;
 return hd+`<h1>How should we cut it?</h1><p class="mu">We find 5 to 10 moments of 15 to 30 seconds. Already know a moment you want? Tell us.</p><div class="seg"><button class="${wz.mode=='auto'?'on':''}" onclick="wz.mode='auto';R()">All automatic</button><button class="${wz.mode=='mine'?'on':''}" onclick="wz.mode='mine';R()">I have ideas</button></div>${wz.mode=='mine'?`<p class="mu">Enter when each short should start, like 1:25. Video length ${fmt(wz.dur)}.</p>${wz.cust.map((t,i)=>`<div class="row"><input type="text" inputmode="numeric" placeholder="m:ss" value="${esc(t)}" onchange="wz.cust[${i}]=this.value" style="margin:0"><button class="btn ghost" style="flex:none" onclick="wz.cust.splice(${i},1);R()">✕</button></div>`).join('')}<button class="btn ghost" style="width:100%" onclick="wz.cust.length<5&&wz.cust.push('');R()">Add another idea</button><div class="sw"><b>Find the rest automatically</b><input type="checkbox" ${wz.fill?'checked':''} onchange="wz.fill=this.checked"></div>`:''}<div class="row">${bk(3)}<button class="btn" onclick="startP()">Create shorts</button></div>`};
async function wpick(f){if(!f)return;const u=URL.createObjectURL(f),d=await new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>r(v.duration);v.onerror=()=>r(0);v.src=u});URL.revokeObjectURL(u);if(!d||d>1860)return toast(d?'Max length is 30 minutes':'This video can’t be read');wz.f=f;wz.dur=d;wz.st=1;R()}
function startP(){const cs=wz.mode=='mine'?wz.cust.filter(t=>String(t).trim()).map(t=>{const p=String(t).trim().split(':').map(Number);return p.length==2?p[0]*60+p[1]:p.length==1?p[0]:NaN}).filter(v=>v>=0&&v<wz.dur-14):[];if(wz.mode=='mine'&&!cs.length)return toast('Enter a start time like 1:25');analyze(wz.f,cs)}
const mEd=()=>`<div class="card"><b>Choose the part to use</b><audio id="ma" src="${mE.url}" preload="metadata" controls style="width:100%;margin:10px 0"></audio><label class="sl">Start ${fmt(mE.s)}<input type="range" min="0" max="${mE.dur}" step=".5" value="${mE.s}" onchange="mtrim('s',+this.value)"></label><label class="sl">End ${fmt(mE.e)}<input type="range" min="0" max="${mE.dur}" step=".5" value="${mE.e}" onchange="mtrim('e',+this.value)"></label><button class="btn ghost" style="width:100%" onclick="mprev()">Preview selection</button><input type="text" id="mn" value="${esc(mE.name)}" placeholder="Name"><div class="row"><button class="btn ghost" onclick="mE=null;R()">Cancel</button><button class="btn" onclick="msave()">Save to library</button></div></div>`;
const vM=pick=>`${pick?'':'<h1>Music</h1><p class="mu">Your saved songs. Upload one to pick the part you like.</p>'}${mE?mEd():`${LIB.map(m=>`<div class="card proj ${pick&&wz.music==m.id?'sel':''}"><div style="flex:1" onclick="${pick?`wz.music=wz.music=='${m.id}'?null:'${m.id}';R()`:''}"><b>${pick&&wz.music==m.id?'✓ ':'♫ '}${esc(m.name)}</b><small>${fmt(m.s)} to ${fmt(m.e)} · ${Math.round(m.e-m.s)}s</small></div><button class="btn ghost" style="flex:none" onclick="delM('${m.id}')">Remove</button></div>`).join('')||'<div class="card c"><b>No music yet</b><p class="mu">Upload a song you downloaded.</p></div>'}<label class="btn" style="display:block;text-align:center;margin:10px 0"><input type="file" accept="audio/*" hidden onchange="mpick(this.files[0])">Upload music</label>`}`;
async function mpick(f){if(!f)return;const url=URL.createObjectURL(f),d=await new Promise(r=>{const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>r(a.duration);a.onerror=()=>r(0);a.src=url});if(!d||!isFinite(d))return toast('This audio can’t be read');mE={f,url,dur:d,s:0,e:Math.min(d,25),name:f.name.replace(/\.[^.]+$/,'')};R()}
function mtrim(k,v){mE.name=$('#mn')?.value||mE.name;mE[k]=v;if(mE.e-mE.s>30)k=='s'?mE.e=Math.min(mE.dur,mE.s+30):mE.s=mE.e-30;if(mE.e-mE.s<5)k=='s'?mE.e=Math.min(mE.dur,mE.s+5):mE.s=Math.max(0,mE.e-5);R()}
function mprev(){const a=$('#ma');a.currentTime=mE.s;a.play();a.ontimeupdate=()=>a.currentTime>=mE.e&&a.pause()}
async function msave(){mE.name=$('#mn').value||'Untitled';const m={id:'m'+Date.now(),user:me,name:mE.name,blob:mE.f,s:mE.s,e:mE.e};try{await mdb('put',m);LIB.push(m);if(tab=='create')wz.music=m.id;URL.revokeObjectURL(mE.url);mE=null;toast('Saved to your library');R()}catch(e){toast('Could not save music')}}
